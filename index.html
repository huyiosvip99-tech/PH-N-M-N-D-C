<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AI KHẢI TƯỜNG — Đọc văn bản</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050816;
  --card:rgba(15,23,42,.72);
  --line:rgba(255,255,255,.10);
  --text:#f8fafc;
  --muted:#94a3b8;

  --blue:#5b8cff;
  --cyan:#22d3ee;
  --purple:#8b5cf6;

  --green:#22c55e;
  --red:#ef4444;

  --shadow:0 25px 80px rgba(0,0,0,.45);
}

body{
  min-height:100vh;
  font-family:Inter,Arial,sans-serif;
  color:var(--text);

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(91,140,255,.25),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 15%,
      rgba(139,92,246,.20),
      transparent 30%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(34,211,238,.13),
      transparent 35%
    ),
    var(--bg);

  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      rgba(255,255,255,.018) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.018) 1px,
      transparent 1px
    );

  background-size:40px 40px;

  mask-image:
    linear-gradient(
      to bottom,
      black,
      transparent
    );
}

.app{
  width:min(1050px,94%);
  margin:0 auto;
  padding:35px 0 60px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:54px;
  height:54px;
  border-radius:17px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:23px;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--purple)
    );

  box-shadow:
    0 0 30px rgba(91,140,255,.4),
    inset 0 1px rgba(255,255,255,.4);
}

.brand h1{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.04em;
}

.brand p{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.hdr-badge{
  padding:8px 12px;

  border:
    1px solid
    rgba(34,211,238,.25);

  background:
    rgba(34,211,238,.07);

  border-radius:999px;

  color:#67e8f9;
  font-size:11px;
  font-weight:700;
}

/* CARD */

.card{
  position:relative;

  background:
    linear-gradient(
      145deg,
      rgba(15,23,42,.86),
      rgba(15,23,42,.58)
    );

  border:
    1px solid
    var(--line);

  border-radius:24px;
  padding:22px;

  box-shadow:var(--shadow);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  margin-bottom:16px;
}

.card::before{
  content:"";

  position:absolute;

  top:0;
  left:12%;

  width:76%;
  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.35),
      transparent
    );
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:15px;
}

.section-title h2{
  font-size:15px;
  font-weight:700;
}

.section-title span{
  color:var(--muted);
  font-size:11px;
}

/* TEXT */

textarea{
  width:100%;
  min-height:210px;

  resize:vertical;

  border:
    1px solid
    var(--line);

  border-radius:17px;

  padding:16px;

  outline:none;

  background:
    rgba(2,6,23,.55);

  color:var(--text);

  font-family:inherit;

  font-size:14px;
  line-height:1.7;

  transition:.2s;
}

textarea:focus{
  border-color:
    rgba(91,140,255,.7);

  box-shadow:
    0 0 0 4px
    rgba(91,140,255,.08);
}

.text-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-top:8px;
}

.counter{
  color:var(--muted);
  font-size:11px;
}

.clear{
  border:0;
  background:none;

  color:#94a3b8;

  cursor:pointer;
  font-size:11px;
}

.clear:hover{
  color:#f87171;
}

/* VOICE */

.voice-grid{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;
}

.voice{
  padding:13px;

  border:
    1px solid
    var(--line);

  background:
    rgba(2,6,23,.35);

  border-radius:15px;

  cursor:pointer;

  transition:.2s;
}

.voice:hover{
  border-color:
    rgba(91,140,255,.5);
}

.voice.active{
  border-color:
    var(--blue);

  background:
    rgba(91,140,255,.10);

  box-shadow:
    0 0 25px
    rgba(91,140,255,.08);
}

.voice-top{
  display:flex;
  gap:10px;
  align-items:center;
}

.avatar{
  width:45px;
  height:45px;

  border-radius:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--purple)
    );

  font-size:15px;
  font-weight:800;

  box-shadow:
    0 5px 20px
    rgba(91,140,255,.25);
}

.voice-name{
  font-size:13px;
  font-weight:800;
}

.voice-lang{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

/* SETTINGS */

.settings{
  display:grid;
  gap:15px;
}

.setting{
  display:grid;

  grid-template-columns:
    100px 1fr 45px;

  gap:12px;

  align-items:center;
}

.setting label{
  color:#cbd5e1;
  font-size:12px;
}

.setting input{
  width:100%;
  accent-color:var(--blue);
}

.value{
  color:#8fb1ff;

  text-align:right;

  font-size:11px;
  font-weight:700;
}

/* WAVE */

.wave{
  height:45px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:4px;

  margin-bottom:15px;
}

.bar{
  width:4px;
  height:5px;

  border-radius:10px;

  background:
    linear-gradient(
      to top,
      var(--blue),
      var(--cyan)
    );

  opacity:.35;
}

.wave.playing .bar{
  animation:
    wave .7s
    ease-in-out
    infinite
    alternate;
}

.bar:nth-child(2){
  animation-delay:.1s;
}

.bar:nth-child(3){
  animation-delay:.2s;
}

.bar:nth-child(4){
  animation-delay:.3s;
}

.bar:nth-child(5){
  animation-delay:.15s;
}

.bar:nth-child(6){
  animation-delay:.35s;
}

.bar:nth-child(7){
  animation-delay:.2s;
}

.bar:nth-child(8){
  animation-delay:.4s;
}

.bar:nth-child(9){
  animation-delay:.1s;
}

.bar:nth-child(10){
  animation-delay:.3s;
}

@keyframes wave{
  from{
    height:5px;
  }

  to{
    height:32px;
  }
}

/* BUTTONS */

.actions{
  display:grid;

  grid-template-columns:
    1fr 50px 50px;

  gap:9px;
}

.btn{
  height:48px;

  border-radius:14px;

  border:
    1px solid
    var(--line);

  background:
    rgba(255,255,255,.04);

  color:white;

  cursor:pointer;

  font-family:inherit;

  font-weight:700;

  transition:.2s;
}

.btn-main{
  border:0;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--purple)
    );

  box-shadow:
    0 12px 35px
    rgba(91,140,255,.25);
}

.btn:hover{
  transform:translateY(-1px);
}

/* STATUS */

.status{
  margin-top:11px;

  display:flex;
  align-items:center;

  gap:7px;

  color:var(--muted);

  font-size:11px;
}

.dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#64748b;
}

.dot.playing{
  background:#22c55e;

  box-shadow:
    0 0 12px
    #22c55e;
}

/* FOOTER */

.footer{
  text-align:center;

  color:#64748b;

  font-size:10px;

  padding-top:5px;
}

/* MOBILE */

@media(max-width:650px){

  .app{
    width:94%;
    padding-top:20px;
  }

  .hdr-badge{
    display:none;
  }

  .card{
    padding:17px;
    border-radius:20px;
  }

  .voice-grid{
    grid-template-columns:1fr;
  }

  .setting{
    grid-template-columns:
      82px 1fr 40px;
  }

  .brand h1{
    font-size:19px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<header class="header">

  <div class="brand">

    <div class="logo">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
    </div>

    <div>

      <h1>AI KHẢI TƯỜNG</h1>

      <p>
        Trợ lý đọc văn bản thông minh
      </p>

    </div>

  </div>

  <div class="hdr-badge">

    <i class="fa-solid fa-bolt"></i>

    AI VOICE

  </div>

</header>


<!-- TEXT -->

<section class="card">

  <div class="section-title">

    <h2>

      <i class="fa-solid fa-file-lines"></i>

      Nhập văn bản cần đọc

    </h2>

    <span id="counter">
      0 ký tự
    </span>

  </div>


  <textarea
    id="txt"
    maxlength="10000"
    placeholder="Nhập hoặc dán văn bản bạn muốn chuyển thành giọng nói vào đây..."
  ></textarea>


  <div class="text-bottom">

    <span class="counter">
      Có thể chỉnh sửa trước khi đọc
    </span>

    <button
      class="clear"
      onclick="clearText()"
    >

      <i class="fa-solid fa-eraser"></i>

      Xóa văn bản

    </button>

  </div>

</section>


<!-- VOICE -->

<section class="card">

  <div class="section-title">

    <h2>

      <i class="fa-solid fa-microphone-lines"></i>

      Giọng đọc

    </h2>

    <span id="voiceStatus">
      Đang tải...
    </span>

  </div>


  <div
    class="voice-grid"
    id="voiceGrid"
  ></div>

</section>


<!-- SETTINGS -->

<section class="card">

  <div class="section-title">

    <h2>

      <i class="fa-solid fa-sliders"></i>

      Điều chỉnh giọng nói

    </h2>

  </div>


  <div class="settings">


    <!-- RATE -->

    <div class="setting">

      <label>

        <i class="fa-solid fa-gauge-high"></i>

        Tốc độ

      </label>

      <input
        id="rate"
        type="range"
        min=".5"
        max="2"
        step=".1"
        value="1"
        oninput="updateSettings()"
      >

      <span
        class="value"
        id="rateV"
      >
        1.0×
      </span>

    </div>


    <!-- PITCH -->

    <div class="setting">

      <label>

        <i class="fa-solid fa-music"></i>

        Âm vực

      </label>

      <input
        id="pitch"
        type="range"
        min="0"
        max="2"
        step=".1"
        value="1"
        oninput="updateSettings()"
      >

      <span
        class="value"
        id="pitchV"
      >
        1.0
      </span>

    </div>


    <!-- VOLUME -->

    <div class="setting">

      <label>

        <i class="fa-solid fa-volume-high"></i>

        Âm lượng

      </label>

      <input
        id="volume"
        type="range"
        min="0"
        max="1"
        step=".05"
        value="1"
        oninput="updateSettings()"
      >

      <span
        class="value"
        id="volumeV"
      >
        100%
      </span>

    </div>

  </div>

</section>


<!-- PLAYER -->

<section class="card">


  <div
    class="wave"
    id="wave"
  >

    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>

  </div>


  <div class="actions">


    <button
      class="btn btn-main"
      onclick="speak()"
    >

      <i
        class="fa-solid fa-play"
        id="playIcon"
      ></i>

      <span id="playText">
        Phát văn bản
      </span>

    </button>


    <button
      class="btn"
      onclick="pauseResume()"
      title="Tạm dừng"
    >

      <i
        class="fa-solid fa-pause"
        id="pauseIcon"
      ></i>

    </button>


    <button
      class="btn"
      onclick="stopSpeech()"
      title="Dừng"
    >

      <i class="fa-solid fa-stop"></i>

    </button>

  </div>


  <div class="status">

    <span
      class="dot"
      id="dot"
    ></span>

    <span id="statusText">
      Sẵn sàng
    </span>

  </div>

</section>


<div class="footer">

  AI KHẢI TƯỜNG
  •
  Text to Speech

</div>

</div>


<script>

/* =========================
   BIẾN CHÍNH
========================= */

const synth =
  window.speechSynthesis;

let voices = [];

let selectedVoice = null;


/* =========================
   DOM
========================= */

const textarea =
  document.getElementById("txt");


/* =========================
   ĐẾM KÝ TỰ
========================= */

textarea.addEventListener(
  "input",
  updateCounter
);


function updateCounter(){

  const length =
    textarea.value.length;


  document.getElementById(
    "counter"
  ).textContent =
    length.toLocaleString(
      "vi-VN"
    ) + " ký tự";

}


/* =========================
   XÓA VĂN BẢN
========================= */

function clearText(){

  textarea.value = "";

  updateCounter();

}


/* =========================
   LOAD GIỌNG ĐỌC
========================= */

function loadVoices(){

  voices =
    synth
      .getVoices()
      .filter(
        v =>
          v.lang &&
          v.lang
            .toLowerCase()
            .startsWith("vi")
      );


  const grid =
    document.getElementById(
      "voiceGrid"
    );


  grid.innerHTML = "";


  if(!voices.length){

    grid.innerHTML = `

      <div
        style="
          grid-column:1/-1;
          padding:20px;
          text-align:center;
          color:#94a3b8;
          font-size:12px;
        "
      >

        Trình duyệt chưa cung cấp
        giọng Tiếng Việt.

        <br>

        Hãy thử Microsoft Edge.

      </div>

    `;


    document.getElementById(
      "voiceStatus"
    ).textContent =
      "Không tìm thấy";


    return;

  }


  document.getElementById(
    "voiceStatus"
  ).textContent =
    "AI KHẢI TƯỜNG";


  voices.forEach(
    (voice,index)=>{

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "voice" +
        (
          index === 0
          ?
          " active"
          :
          ""
        );


      item.innerHTML = `

        <div class="voice-top">

          <div class="avatar">
            K
          </div>

          <div>

            <div class="voice-name">
              AI KHẢI TƯỜNG
            </div>

            <div class="voice-lang">
              ${voice.lang}
            </div>

          </div>

        </div>

      `;


      item.onclick =
        function(){

          document
            .querySelectorAll(
              ".voice"
            )
            .forEach(
              v =>
                v.classList.remove(
                  "active"
                )
            );


          item.classList.add(
            "active"
          );


          selectedVoice =
            voice;

        };


      grid.appendChild(item);

    }
  );


  selectedVoice =
    voices[0];

}


/* =========================
   LOAD VOICES
========================= */

loadVoices();


if(
  synth.onvoiceschanged !==
  undefined
){

  synth.onvoiceschanged =
    loadVoices;

}


/* =========================
   ĐIỀU CHỈNH GIỌNG
========================= */

function updateSettings(){

  const rate =
    parseFloat(
      document.getElementById(
        "rate"
      ).value
    );


  const pitch =
    parseFloat(
      document.getElementById(
        "pitch"
      ).value
    );


  const volume =
    parseFloat(
      document.getElementById(
        "volume"
      ).value
    );


  document.getElementById(
    "rateV"
  ).textContent =
    rate.toFixed(1) +
    "×";


  document.getElementById(
    "pitchV"
  ).textContent =
    pitch.toFixed(1);


  document.getElementById(
    "volumeV"
  ).textContent =
    Math.round(
      volume * 100
    ) + "%";

}


/* =========================
   ĐỌC VĂN BẢN
========================= */

function speak(){

  const text =
    textarea.value.trim();


  if(!text){

    alert(
      "Vui lòng nhập văn bản trước khi phát."
    );

    return;

  }


  if(
    !(
      "speechSynthesis"
      in window
    )
  ){

    alert(
      "Trình duyệt không hỗ trợ đọc văn bản."
    );

    return;

  }


  synth.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  if(selectedVoice){

    utterance.voice =
      selectedVoice;

  }


  utterance.lang =
    "vi-VN";


  utterance.rate =
    parseFloat(
      document.getElementById(
        "rate"
      ).value
    );


  utterance.pitch =
    parseFloat(
      document.getElementById(
        "pitch"
      ).value
    );


  utterance.volume =
    parseFloat(
      document.getElementById(
        "volume"
      ).value
    );


  utterance.onstart =
    function(){

      setPlaying(true);

    };


  utterance.onend =
    function(){

      setPlaying(false);

    };


  utterance.onerror =
    function(){

      setPlaying(false);

    };


  synth.speak(
    utterance
  );

}


/* =========================
   TẠM DỪNG / TIẾP TỤC
========================= */

function pauseResume(){

  if(!synth.speaking)
    return;


  if(synth.paused){

    synth.resume();

    setPlaying(true);

    document.getElementById(
      "pauseIcon"
    ).className =
      "fa-solid fa-pause";

  }

  else{

    synth.pause();

    setPlaying(false);

    document.getElementById(
      "statusText"
    ).textContent =
      "Đang tạm dừng";


    document.getElementById(
      "pauseIcon"
    ).className =
      "fa-solid fa-play";

  }

}


/* =========================
   DỪNG ĐỌC
========================= */

function stopSpeech(){

  synth.cancel();

  setPlaying(false);


  document.getElementById(
    "pauseIcon"
  ).className =
    "fa-solid fa-pause";


  document.getElementById(
    "playText"
  ).textContent =
    "Phát văn bản";

}


/* =========================
   TRẠNG THÁI PHÁT
========================= */

function setPlaying(
  playing
){

  const wave =
    document.getElementById(
      "wave"
    );


  const dot =
    document.getElementById(
      "dot"
    );


  const status =
    document.getElementById(
      "statusText"
    );


  const playIcon =
    document.getElementById(
      "playIcon"
    );


  if(playing){

    wave.classList.add(
      "playing"
    );


    dot.classList.add(
      "playing"
    );


    status.textContent =
      "AI KHẢI TƯỜNG đang đọc văn bản...";


    playIcon.className =
      "fa-solid fa-volume-high";


    document.getElementById(
      "playText"
    ).textContent =
      "Đang phát";

  }

  else{

    wave.classList.remove(
      "playing"
    );


    dot.classList.remove(
      "playing"
    );


    status.textContent =
      "Sẵn sàng";


    playIcon.className =
      "fa-solid fa-play";


    document.getElementById(
      "playText"
    ).textContent =
      "Phát văn bản";

  }

}


/* =========================
   KHỞI ĐỘNG
========================= */

updateCounter();

updateSettings();

</script>

</body>
</html>
